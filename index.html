<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seni Seviyorum Hatunum</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #050505;
            touch-action: none; user-select: none;
        }
        canvas { display: block; }
        .ui {
            position: absolute; top: 10%; width: 100%;
            text-align: center; color: white;
            font-family: 'Times New Roman', serif;
            pointer-events: none; z-index: 10;
        }
        h1 { font-style: italic; font-weight: 300; letter-spacing: 2px; }
        .clean-btn {
            position: absolute; bottom: 30px; left: 50%;
            transform: translateX(-50%); padding: 12px 30px;
            background: rgba(255, 182, 193, 0.1); /* Hafif pembe ton */
            border: 1px solid rgba(255, 192, 203, 0.5);
            color: #ffb6c1; border-radius: 20px;
            cursor: pointer; z-index: 20; transition: 0.3s;
        }
    </style>
</head>
<body>

    <div class="ui">
        <h1>Hatunuma Özel Bahçe</h1>
    </div>

    <canvas id="loveCanvas"></canvas>
    <button class="clean-btn" id="reset">Bahçeyi Temizle</button>

    <script>
        const canvas = document.getElementById('loveCanvas');
        const ctx = canvas.getContext('2d');
        const resetBtn = document.getElementById('reset');
        
        let flowers = [];
        let hearts = [];
        let texts = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class TextEffect {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.opacity = 1;
                this.text = "Seni Seviyorum Hatunum";
            }
            update() {
                this.y -= 0.5; // Yavaşça yüksel
                this.opacity -= 0.007; // Yavaşça silin
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = "#ffb6c1"; // Toz pembe
                ctx.font = "italic 18px 'Times New Roman'";
                ctx.textAlign = "center";
                ctx.fillText(this.text, this.x, this.y - 40);
                ctx.restore();
            }
        }

        class Flower {
            constructor(x, y) {
                this.x = x; this.y = y; this.size = 0;
                this.maxSize = Math.random() * 12 + 10;
                this.color = `hsl(${Math.random() * 20 + 340}, 80%, 75%)`; // Pembe ve kırmızı tonları
                this.petalCount = 6;
            }
            update() { if (this.size < this.maxSize) this.size += 0.4; }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                for (let i = 0; i < this.petalCount; i++) {
                    ctx.rotate((Math.PI * 2) / this.petalCount);
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.ellipse(0, this.size, this.size / 2, this.size, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.beginPath();
                ctx.fillStyle = "#fff";
                ctx.arc(0, 0, this.size / 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Heart {
            constructor(x, y) {
                this.x = x; this.y = y; this.size = 0;
                this.maxSize = Math.random() * 8 + 5;
                this.color = "#ff4d6d";
                this.speedY = -Math.random() * 1 - 0.5;
                this.opacity = 1;
            }
            update() {
                if (this.size < this.maxSize) this.size += 0.5;
                else { this.y += this.speedY; this.opacity -= 0.005; }
            }
            draw() {
                if (this.opacity <= 0) return;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(0, this.size / 2);
                ctx.bezierCurveTo(-this.size, -this.size / 2, -this.size, this.size / 2, 0, this.size);
                ctx.bezierCurveTo(this.size, this.size / 2, this.size, -this.size / 2, 0, this.size / 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function handleInput(e) {
            if (e.target.id === 'reset') return;
            const x = (e.clientX || (e.touches && e.touches[0].clientX));
            const y = (e.clientY || (e.touches && e.touches[0].clientY));
            
            flowers.push(new Flower(x, y));
            texts.push(new TextEffect(x, y));
            for(let i=0; i<3; i++) hearts.push(new Heart(x + (Math.random()*40-20), y));
        }

        window.addEventListener('pointerdown', handleInput);

        function animate() {
            ctx.fillStyle = "#050505";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            hearts.forEach((h, i) => { h.update(); h.draw(); if(h.opacity <= 0) hearts.splice(i, 1); });
            texts.forEach((t, i) => { t.update(); t.draw(); if(t.opacity <= 0) texts.splice(i, 1); });
            flowers.forEach(f => { f.update(); f.draw(); });

            requestAnimationFrame(animate);
        }

        resetBtn.addEventListener('click', (e) => { e.stopPropagation(); flowers = []; hearts = []; texts = []; });
        animate();
    </script>
</body>
</html>
