<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seni Seviyorum Hatunum</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #050505;
            touch-action: none; user-select: none;
        }
        canvas { display: block; }
        .ui {
            position: absolute; top: 10%; width: 100%;
            text-align: center; color: white;
            font-family: 'Times New Roman', serif;
            pointer-events: none; z-index: 10;
        }
        h1 { font-style: italic; font-weight: 300; letter-spacing: 2px; }
        .clean-btn {
            position: absolute; bottom: 30px; left: 50%;
            transform: translateX(-50%); padding: 12px 30px;
            background: rgba(255, 182, 193, 0.1); /* Hafif pembe ton */
            border: 1px solid rgba(255, 192, 203, 0.5);
            color: #ffb6c1; border-radius: 20px;
            cursor: pointer; z-index: 20; transition: 0.3s;
        }
    </style>
</head>
<body>

    <div class="ui">
        <h1>Hatunuma Özel Bahçe</h1>
    </div>

    <canvas id="loveCanvas"></canvas>
    <button class="clean-btn" id="reset">Bahçeyi Temizle</button>

    <script>
        const canvas = document.getElementById('loveCanvas');
        const ctx = canvas.getContext('2d');
        const resetBtn = document.getElementById('reset');
        
        let flowers = [];
        let hearts = [];
        let texts = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class TextEffect {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.opacity = 1;
                this.text = "Seni Seviyorum Hatunum";
            }
            update() {
                this.y -= 0.5; // Yavaşça yüksel
                this.opacity -= 0.007; // Yavaşça silin
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = "#ffb6c1"; // Toz pembe
                ctx.font = "italic 18px 'Times New Roman'";
                ctx.textAlign = "center";
                ctx.fillText(this.text, this.x, this.y - 40);
                ctx.restore();
            }
        }
