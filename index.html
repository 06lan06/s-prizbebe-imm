<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Çiçek Bahçesi</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000; /* Siyah arka plan */
            touch-action: none; /* Sayfa kaymasını engelle */
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .ui {
            position: absolute;
            top: 10%;
            width: 100%;
            text-align: center;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
            z-index: 10;
        }
        .clean-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 40px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #fff;
            color: #fff;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            z-index: 20;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div class="ui">
        <h1>Çiçek Bahçesi</h1>
        <p>Ekrana dokunarak çiçek ekle</p>
    </div>

    <canvas id="flowerCanvas"></canvas>
    <button class="clean-btn" id="reset">Temizle</button>

    <script>
        const canvas = document.getElementById('flowerCanvas');
        const ctx = canvas.getContext('2d');
        const resetBtn = document.getElementById('reset');
        
        let flowers = [];

        // Ekran boyutunu ayarla
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Flower {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = 0;
                this.maxSize = Math.random() * 20 + 15;
                this.color = `hsl(${Math.random() * 360}, 80%, 60%)`;
                this.petalCount = Math.floor(Math.random() * 3) + 5;
            }

            update() {
                if (this.size < this.maxSize) {
                    this.size += 0.8;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Yapraklar
                for (let i = 0; i < this.petalCount; i++) {
                    ctx.beginPath();
                    ctx.rotate((Math.PI * 2) / this.petalCount);
                    ctx.fillStyle = this.color;
                    ctx.ellipse(0, this.size, this.size / 2, this.size, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Orta sarı kısım
                ctx.beginPath();
                ctx.fillStyle = "#FFD700";
                ctx.arc(0, 0, this.size / 2.5, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }

        function handleInput(e) {
            // Eğer butona tıklandıysa çiçek çıkarma
            if (e.target.id === 'reset') return;

            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
            const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
            
            flowers.push(new Flower(x, y));
        }

        // Hem dokunma hem tıklama için tek olay: pointerdown
        window.addEventListener('pointerdown', handleInput);

        function animate() {
            // Arka planı her karede siyahla boya
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            flowers.forEach(flower => {
                flower.update();
                flower.draw();
            });

            requestAnimationFrame(animate);
        }

        resetBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            flowers = [];
        });

        // Başlat
        animate();
    </script>
</body>
</html>
