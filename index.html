<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drow Flowers - Mobile Fix</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; color: white; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }
        .ui { position: absolute; top: 10px; width: 100%; text-align: center; pointer-events: none; }
        .clean-btn {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            padding: 15px 30px; background: rgba(255,255,255,0.1); border: 1px solid white;
            color: white; border-radius: 5px; font-size: 16px; pointer-events: auto;
        }
    </style>
</head>
<body>

    <div class="ui">
        <h2>Çiçek Çizici</h2>
        <p>Ekrana Dokun!</p>
    </div>

    <canvas id="canvas"></canvas>
    <button class="clean-btn">Temizle</button>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const cleanBtn = document.querySelector('.clean-btn');
        let flowers = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Flower {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = 0;
                this.maxSize = Math.random() * 25 + 15;
                this.color = `hsl(${Math.random() * 360}, 80%, 60%)`;
                this.petals = Math.floor(Math.random() * 3) + 5;
                this.stemHeight = Math.random() * 80 + 40;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Sap
                ctx.strokeStyle = '#3e7d37';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.quadraticCurveTo(5, this.stemHeight/2, 0, this.stemHeight);
                ctx.stroke();

                // Çiçek Yaprakları
                for (let i = 0; i < this.petals; i++) {
                    ctx.rotate((Math.PI * 2) / this.petals);
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.ellipse(0, this.size, this.size/1.8, this.size, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Orta
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(0, 0, this.size/2.5, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
                if (this.size < this.maxSize) this.size += 1.2;
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Temiz bir görüntü için
            flowers.forEach(flower => flower.draw());
            requestAnimationFrame(animate);
        }

        // --- HEM TELEFON HEM BİLGİSAYAR İÇİN FONKSİYON ---
        function addFlower(e) {
            // Eğer dokunmatikse (touch), koordinatları ona göre al
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            
            // Temizle butonuna basılmadığından emin ol
            if (e.target.tagName !== 'BUTTON') {
                flowers.push(new Flower(x, y));
            }
        }

        // Dokunmatik desteği
        window.addEventListener('touchstart', (e) => {
            addFlower(e);
        }, { passive: false });

        // Fare desteği
        window.addEventListener('mousedown', (e) => {
            addFlower(e);
        });

        cleanBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Butona tıklayınca çiçek oluşmasını engeller
            flowers = [];
        });

        animate();
    </script>
</body>
</html>
